databaseChangeLog:
  - changeSet:
      id: 016-create-holiday-table
      author: saak
      changes:
        - createTable:
            tableName: holiday
            columns:
              - column:
                  name: date
                  type: date
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: beschreibung
                  type: varchar(500)
                  constraints:
                    nullable: true
              - column:
                  name: frei
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: holiday
            indexName: idx_holiday_name
            columns:
              - column:
                  name: name
