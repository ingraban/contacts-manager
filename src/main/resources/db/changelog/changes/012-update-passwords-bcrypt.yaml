databaseChangeLog:
  - changeSet:
      id: 012-update-passwords-bcrypt
      author: saak
      changes:
        # Passwörter mit BCrypt-Hash aktualisieren
        # BCrypt-Hash für "geheim": $2a$10$TzLRacfxN4VjK2ln9vVhFOCH7sH8XSfc.tqbXjoA3.4S1kgoJ6vFe
        - update:
            tableName: app_user
            columns:
              - column:
                  name: password
                  value: $2a$10$TzLRacfxN4VjK2ln9vVhFOCH7sH8XSfc.tqbXjoA3.4S1kgoJ6vFe
            where: username = 'admin'

        - update:
            tableName: app_user
            columns:
              - column:
                  name: password
                  value: $2a$10$TzLRacfxN4VjK2ln9vVhFOCH7sH8XSfc.tqbXjoA3.4S1kgoJ6vFe
            where: username = 'contact'
