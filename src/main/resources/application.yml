# Development Configuration
# Für Production verwenden Sie: --spring.profiles.active=prod

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

spring:
  thymeleaf:
    cache: false  # Development: Caching deaktiviert für schnellere Entwicklung

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  datasource:
    # H2 In-Memory Database (Development)
    url: jdbc:h2:mem:contactdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  security:
    oauth2:
      client:
        registration:
          gitea:
            client-id: ${OAUTH2_CLIENT_ID:your-client-id}
            client-secret: ${OAUTH2_CLIENT_SECRET:your-client-secret}
            scope: read:user
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Gitea
        provider:
          gitea:
            authorization-uri: https://projects.sommerhausen.de/login/oauth/authorize
            token-uri: https://projects.sommerhausen.de/login/oauth/access_token
            user-info-uri: https://projects.sommerhausen.de/api/v1/user
            user-name-attribute: login

# Application-specific Configuration
app:
  backup:
    enabled: true
    directory: ${APP_BACKUP_DIRECTORY:./backup}
    cron: "0 0 16 * * *"  # Täglich um 2:00 Uhr
    encryption:
      password: ${BACKUP_ENCRYPTION_PASSWORD:}

  holidays:
    region: ${HOLIDAYS_REGION:BY}  # Bundesland für Feiertags-Import (BY = Bayern)
