<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benutzer bearbeiten - Sommerhausen Office Suite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .admin-content-inner {
            max-width: 800px;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 1.5rem;
            background: #fff;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-group > div {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            cursor: pointer;
            margin: 0;
        }

        .readonly {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/app-layout :: app-layout('users', ~{::content})}">
        <th:block th:fragment="content">
            <h1>Benutzer bearbeiten</h1>

        <!-- Error Messages -->
        <div th:if="${errorMessage}" class="alert alert-error">
            <p th:text="${errorMessage}"></p>
        </div>

        <form method="post" th:action="@{/admin/users/{id}(id=${user.id})}"
              class="form-container">
            <input type="hidden" th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label>Benutzername</label>
                <input type="text" th:value="${user.username}" readonly class="readonly">
            </div>

            <div class="form-group">
                <label>Anzeigename</label>
                <input type="text" th:value="${user.displayName}" readonly class="readonly">
            </div>

            <div class="form-group">
                <label>E-Mail</label>
                <input type="text" th:value="${user.email}" readonly class="readonly">
            </div>

            <div class="form-group">
                <label>Authentifizierungsquelle</label>
                <input type="text" th:value="${user.authSource}" readonly class="readonly">
            </div>

            <!-- Passwort-Feld nur für LOCAL-Benutzer -->
            <div class="form-group" th:if="${user.authSource.name() == 'LOCAL'}">
                <label for="password">Neues Passwort</label>
                <input type="password" id="password" name="password" placeholder="Leer lassen, um Passwort nicht zu ändern">
                <p style="color: #666; font-size: 0.9em; margin-top: 5px;">
                    Lassen Sie dieses Feld leer, wenn Sie das Passwort nicht ändern möchten.
                </p>
            </div>

            <div class="form-group">
                <label>
                    <!-- Hidden field für Spring: wenn checkbox nicht gesetzt, wird false verwendet -->
                    <input type="hidden" name="_enabled" value="on">
                    <input type="checkbox" name="enabled" value="true"
                           th:checked="${user.enabled}"
                           style="width: 18px; height: 18px; margin-right: 8px; vertical-align: middle;">
                    Benutzer aktiviert
                </label>
                <p style="color: #666; font-size: 0.9em; margin-top: 5px;">
                    Nur aktivierte Benutzer können sich anmelden.
                </p>
            </div>

            <div class="form-group">
                <label>Rollen zuweisen *</label>
                <div class="checkbox-group">
                    <div th:each="role : ${availableRoles}">
                        <input type="checkbox"
                               name="roleIds"
                               th:value="${role.id}"
                               th:id="'role-' + ${role.id}"
                               th:checked="${user.roles.contains(role)}">
                        <label th:for="'role-' + ${role.id}">
                            <strong th:text="${role.name}"></strong>
                            <span th:if="${role.description}"
                                  th:text="' - ' + ${role.description}"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Speichern</button>
                <a th:href="@{/admin/users}" class="btn btn-secondary">Abbrechen</a>
            </div>
        </form>
        </th:block>
    </th:block>
</body>
</html>
