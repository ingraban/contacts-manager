<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benutzerverwaltung - Sommerhausen Office Suite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <th:block th:replace="~{fragments/admin-layout :: admin-layout('users', ~{::content})}">
        <th:block th:fragment="content">
            <h1>Benutzerverwaltung</h1>

        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success">
            <p th:text="${successMessage}"></p>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <p th:text="${errorMessage}"></p>
        </div>

        <!-- User Table -->
        <div th:if="${users.empty}" class="empty-state">
            <p>Keine Benutzer gefunden.</p>
        </div>

        <table class="contact-table" th:unless="${users.empty}">
            <thead>
                <tr>
                    <th>Benutzername</th>
                    <th>Anzeigename</th>
                    <th>E-Mail</th>
                    <th>Quelle</th>
                    <th>Status</th>
                    <th>Rollen</th>
                    <th>Letzter Login</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.displayName}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <span th:text="${user.authSource}"
                              class="hashtag-badge"
                              th:classappend="${user.authSource.name() == 'LOCAL'} ? 'hashtag-badge-local' : 'hashtag-badge-gitea'"></span>
                    </td>
                    <td>
                        <span th:if="${user.enabled}"
                              class="hashtag-badge hashtag-badge-active"
                              style="background-color: #28a745; color: white;">
                            Aktiv
                        </span>
                        <span th:unless="${user.enabled}"
                              class="hashtag-badge hashtag-badge-disabled"
                              style="background-color: #dc3545; color: white;">
                            Gesperrt
                        </span>
                    </td>
                    <td>
                        <span th:each="role : ${user.roles}"
                              class="hashtag-badge"
                              th:text="${role.name}"></span>
                    </td>
                    <td th:text="${#temporals.format(user.lastLogin, 'dd.MM.yyyy HH:mm')}"></td>
                    <td class="actions">
                        <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                           class="btn btn-small btn-secondary"
                           title="Bearbeiten">
                            <i class="bi bi-pencil"></i>
                        </a>

                        <form method="post"
                              th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                              style="display: inline;"
                              onsubmit="return confirm('Möchten Sie diesen Benutzer wirklich löschen?');">
                            <input type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-small btn-danger"
                                    title="Löschen">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        </th:block>
    </th:block>
</body>
</html>
