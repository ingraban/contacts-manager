<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Mitarbeiter bearbeiten' : 'Neuer Mitarbeiter'} + ' - Sommerhausen Office Suite'">
        Sommerhausen Office Suite
    </title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/person-badge.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .workdays-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .workday-item {
            padding: 0.75rem;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            background: #f9fafb;
        }

        .workday-item.active {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .workday-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .workday-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        .workday-hours {
            margin-top: 0.5rem;
        }

        .workday-hours input[type="time"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/app-layout :: app-layout('employees', ~{::content})}">
        <th:block th:fragment="content">
            <h1 th:text="${isEdit ? 'Mitarbeiter bearbeiten' : 'Neuer Mitarbeiter'}">Mitarbeiter</h1>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert alert-error">
                <p th:text="${errorMessage}"></p>
            </div>

            <!-- Form -->
            <form method="post"
                  th:action="${isEdit ? '/employees/' + employee.id : '/employees'}"
                  th:object="${employee}"
                  class="contact-form">

                <!-- CSRF Token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Contact Selection (only for new employees) -->
                <div th:if="${!isEdit}" class="form-group">
                    <label for="contactId">Kontakt <span class="required">*</span></label>
                    <select id="contactId"
                            name="contactId"
                            class="form-control"
                            required>
                        <option value="">-- Bitte wählen --</option>
                        <option th:each="contact : ${contacts}"
                                th:value="${contact.id}"
                                th:text="${contact.vorname + ' ' + contact.nachname + (contact.firma != null ? ' (' + contact.firma + ')' : '')}">
                        </option>
                    </select>
                    <small class="form-hint">
                        <i class="bi bi-info-circle"></i>
                        Wählen Sie den Kontakt aus, der zum Mitarbeiter wird
                    </small>
                </div>

                <!-- Contact Display (for editing) -->
                <div th:if="${isEdit}" class="form-group">
                    <label>Kontakt</label>
                    <div class="info-box">
                        <i class="bi bi-person"></i>
                        <strong>
                            <span th:text="${employee.contact.vorname}"></span>
                            <span th:text="${employee.contact.nachname}"></span>
                        </strong>
                        <span th:if="${employee.contact.firma}"
                              th:text="' (' + ${employee.contact.firma} + ')'"
                              style="color: #666;"></span>
                    </div>
                    <small class="form-hint">
                        <i class="bi bi-info-circle"></i>
                        Der zugeordnete Kontakt kann nicht geändert werden
                    </small>
                </div>

                <!-- Department -->
                <div class="form-group">
                    <label for="departmentId">Abteilung <span class="required">*</span></label>
                    <select id="departmentId"
                            name="departmentId"
                            class="form-control"
                            required>
                        <option value="">-- Bitte wählen --</option>
                        <option th:each="department : ${departments}"
                                th:value="${department.id}"
                                th:selected="${isEdit && employee.department.id == department.id}"
                                th:text="${department.name}">
                        </option>
                    </select>
                </div>

                <!-- Weekly Hours -->
                <div class="form-group">
                    <label for="weeklyHours">Wochenstunden <span class="required">*</span></label>
                    <input type="number"
                           id="weeklyHours"
                           th:field="*{weeklyHours}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('weeklyHours')} ? 'error-input' : ''"
                           min="1"
                           max="168"
                           required>
                    <span th:if="${#fields.hasErrors('weeklyHours')}"
                          th:errors="*{weeklyHours}"
                          class="error"></span>
                </div>

                <!-- Working Days -->
                <div class="form-group">
                    <label>Arbeitstage</label>
                    <div class="workdays-grid">
                        <!-- Monday -->
                        <div class="workday-item">
                            <div class="workday-checkbox">
                                <input type="hidden" name="_worksMonday" value="on">
                                <input type="checkbox"
                                       id="worksMonday"
                                       th:field="*{worksMonday}">
                                <label for="worksMonday">Montag</label>
                            </div>
                            <div class="workday-hours">
                                <input type="time"
                                       th:field="*{mondayHours}"
                                       step="900"
                                       placeholder="Stunden">
                            </div>
                        </div>

                        <!-- Tuesday -->
                        <div class="workday-item">
                            <div class="workday-checkbox">
                                <input type="hidden" name="_worksTuesday" value="on">
                                <input type="checkbox"
                                       id="worksTuesday"
                                       th:field="*{worksTuesday}">
                                <label for="worksTuesday">Dienstag</label>
                            </div>
                            <div class="workday-hours">
                                <input type="time"
                                       th:field="*{tuesdayHours}"
                                       step="900"
                                       placeholder="Stunden">
                            </div>
                        </div>

                        <!-- Wednesday -->
                        <div class="workday-item">
                            <div class="workday-checkbox">
                                <input type="hidden" name="_worksWednesday" value="on">
                                <input type="checkbox"
                                       id="worksWednesday"
                                       th:field="*{worksWednesday}">
                                <label for="worksWednesday">Mittwoch</label>
                            </div>
                            <div class="workday-hours">
                                <input type="time"
                                       th:field="*{wednesdayHours}"
                                       step="900"
                                       placeholder="Stunden">
                            </div>
                        </div>

                        <!-- Thursday -->
                        <div class="workday-item">
                            <div class="workday-checkbox">
                                <input type="hidden" name="_worksThursday" value="on">
                                <input type="checkbox"
                                       id="worksThursday"
                                       th:field="*{worksThursday}">
                                <label for="worksThursday">Donnerstag</label>
                            </div>
                            <div class="workday-hours">
                                <input type="time"
                                       th:field="*{thursdayHours}"
                                       step="900"
                                       placeholder="Stunden">
                            </div>
                        </div>

                        <!-- Friday -->
                        <div class="workday-item">
                            <div class="workday-checkbox">
                                <input type="hidden" name="_worksFriday" value="on">
                                <input type="checkbox"
                                       id="worksFriday"
                                       th:field="*{worksFriday}">
                                <label for="worksFriday">Freitag</label>
                            </div>
                            <div class="workday-hours">
                                <input type="time"
                                       th:field="*{fridayHours}"
                                       step="900"
                                       placeholder="Stunden">
                            </div>
                        </div>

                        <!-- Saturday -->
                        <div class="workday-item">
                            <div class="workday-checkbox">
                                <input type="hidden" name="_worksSaturday" value="on">
                                <input type="checkbox"
                                       id="worksSaturday"
                                       th:field="*{worksSaturday}">
                                <label for="worksSaturday">Samstag</label>
                            </div>
                            <div class="workday-hours">
                                <input type="time"
                                       th:field="*{saturdayHours}"
                                       step="900"
                                       placeholder="Stunden">
                            </div>
                        </div>

                        <!-- Sunday -->
                        <div class="workday-item">
                            <div class="workday-checkbox">
                                <input type="hidden" name="_worksSunday" value="on">
                                <input type="checkbox"
                                       id="worksSunday"
                                       th:field="*{worksSunday}">
                                <label for="worksSunday">Sonntag</label>
                            </div>
                            <div class="workday-hours">
                                <input type="time"
                                       th:field="*{sundayHours}"
                                       step="900"
                                       placeholder="Stunden">
                            </div>
                        </div>
                    </div>
                    <small class="form-hint">
                        <i class="bi bi-info-circle"></i>
                        Wählen Sie die Arbeitstage aus und geben Sie optional die täglichen Arbeitsstunden an
                    </small>
                </div>

                <!-- Buttons -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:title="${isEdit ? 'Aktualisieren' : 'Erstellen'}">
                        <i class="bi bi-check-lg"></i>
                        <span th:text="${isEdit ? 'Aktualisieren' : 'Erstellen'}">Speichern</span>
                    </button>
                    <a th:href="@{/employees}" class="btn btn-secondary" title="Abbrechen">
                        <i class="bi bi-x-lg"></i>
                        Abbrechen
                    </a>
                </div>
            </form>

            <script th:src="@{/js/app.js}"></script>
        </th:block>
    </th:block>
</body>
</html>
