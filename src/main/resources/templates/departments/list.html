<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abteilungen - Sommerhausen Office Suite</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/building.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        /* Variante 2 Style - Suchfeld ohne Submit-Button */
        .search-section {
            margin: 1.5rem 0;
        }

        .search-form {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .search-form .search-wrapper {
            flex: 1;
            margin: 0;
            position: relative;
            display: flex;
            align-items: center;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            background-color: #fff;
            padding: 10px 14px;
            transition: all 0.3s ease;
        }

        .search-form .search-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            color: #999;
            font-size: 18px;
            margin-right: 10px;
            pointer-events: none;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 0;
            color: #333;
        }

        .search-input::placeholder {
            color: #bbb;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/app-layout :: app-layout('departments', ~{::content})}">
        <th:block th:fragment="content">
            <h1>Abteilungsverwaltung</h1>

            <!-- Success/Error Messages -->
            <div th:if="${successMessage}" class="alert alert-success">
                <p th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" class="alert alert-error">
                <p th:text="${errorMessage}"></p>
            </div>

            <!-- Search Form -->
            <div class="search-section">
                <form method="get" th:action="@{/departments}" class="search-form">
                    <div class="search-wrapper">
                        <i class="bi bi-search search-icon"></i>
                        <input type="search"
                               name="search"
                               th:value="${searchTerm}"
                               placeholder="Suche nach Name oder Beschreibung..."
                               class="search-input"
                               autocomplete="off">
                    </div>
                </form>
            </div>

            <!-- Create Button -->
            <div class="action-section">
                <a th:href="@{/departments/new}" class="btn btn-primary" title="Neue Abteilung">
                    <i class="bi bi-plus-lg"></i>
                    Neue Abteilung
                </a>
            </div>

            <!-- Results Info -->
            <p th:if="${searchTerm}" class="results-info">
                <span th:text="${departments.size()}">0</span> Abteilung(en) gefunden für:
                <strong th:text="${searchTerm}"></strong>
            </p>

            <!-- Department Table -->
            <div th:if="${departments.empty}" class="empty-state">
                <p>Keine Abteilungen gefunden.</p>
            </div>

            <table th:unless="${departments.empty}" class="contact-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Beschreibung</th>
                        <th>Mitarbeiter</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="department : ${departments}">
                        <td>
                            <strong th:text="${department.name}"></strong>
                        </td>
                        <td>
                            <span th:if="${department.beschreibung}" th:text="${department.beschreibung}"></span>
                            <span th:unless="${department.beschreibung}">-</span>
                        </td>
                        <td>
                            <span th:text="${department.employees.size()}">0</span>
                        </td>
                        <td class="actions">
                            <a th:href="@{/departments/{id}/edit(id=${department.id})}"
                               class="btn btn-small btn-secondary"
                               title="Bearbeiten">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <form method="post"
                                  th:action="@{/departments/{id}/delete(id=${department.id})}"
                                  class="delete-department-form"
                                  style="display: inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-small btn-danger" title="Löschen">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <script th:src="@{/js/app.js}"></script>
        </th:block>
    </th:block>
</body>
</html>
