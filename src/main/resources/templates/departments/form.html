<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Abteilung bearbeiten' : 'Neue Abteilung'} + ' - Sommerhausen Office Suite'">
        Sommerhausen Office Suite
    </title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/building.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <th:block th:replace="~{fragments/app-layout :: app-layout('departments', ~{::content})}">
        <th:block th:fragment="content">
            <h1 th:text="${isEdit ? 'Abteilung bearbeiten' : 'Neue Abteilung'}">Abteilung</h1>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert alert-error">
                <p th:text="${errorMessage}"></p>
            </div>

            <!-- Form -->
            <form method="post"
                  th:action="${isEdit ? '/departments/' + department.id : '/departments'}"
                  th:object="${department}"
                  class="contact-form">

                <!-- CSRF Token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Name <span class="required">*</span></label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'error-input' : ''"
                           maxlength="50"
                           placeholder="z.B. Verwaltung, IT, Vertrieb"
                           required>
                    <span th:if="${#fields.hasErrors('name')}"
                          th:errors="*{name}"
                          class="error"></span>
                    <small class="form-hint">
                        <i class="bi bi-info-circle"></i>
                        Der Name muss eindeutig sein (2-50 Zeichen)
                    </small>
                </div>

                <!-- Beschreibung -->
                <div class="form-group">
                    <label for="beschreibung">Beschreibung</label>
                    <textarea id="beschreibung"
                              th:field="*{beschreibung}"
                              class="form-control"
                              th:classappend="${#fields.hasErrors('beschreibung')} ? 'error-input' : ''"
                              maxlength="500"
                              rows="3"
                              placeholder="Optionale Beschreibung der Abteilung"></textarea>
                    <span th:if="${#fields.hasErrors('beschreibung')}"
                          th:errors="*{beschreibung}"
                          class="error"></span>
                </div>

                <!-- Info about employees if editing -->
                <div th:if="${isEdit && department.employees != null && !department.employees.empty}" class="info-box">
                    <i class="bi bi-people"></i>
                    Diese Abteilung hat <strong th:text="${department.employees.size()}">0</strong> Mitarbeiter.
                </div>

                <!-- Buttons -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:title="${isEdit ? 'Aktualisieren' : 'Erstellen'}">
                        <i class="bi bi-check-lg"></i>
                        <span th:text="${isEdit ? 'Aktualisieren' : 'Erstellen'}">Speichern</span>
                    </button>
                    <a th:href="@{/departments}" class="btn btn-secondary" title="Abbrechen">
                        <i class="bi bi-x-lg"></i>
                        Abbrechen
                    </a>
                </div>
            </form>

            <script th:src="@{/js/app.js}"></script>
        </th:block>
    </th:block>
</body>
</html>
