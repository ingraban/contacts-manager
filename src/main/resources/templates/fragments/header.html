<!-- src/main/resources/templates/fragments/header.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<body>
  <!-- Header Fragment -->
  <header class="header" th:fragment="header(activePage)">
    <div class="header-content">
      <h1>Sommerhausen Office Suite</h1>
      <nav class="nav">
        <a href="/contacts"
           th:classappend="${activePage == 'contacts'} ? 'active' : ''"
           sec:authorize="hasRole('CONTACT')">Kontakte</a>
        <a href="/hashtags"
           th:classappend="${activePage == 'hastags'} ? 'active' : ''"
           sec:authorize="hasRole('CONTACT')">Hashtags</a>

        <!-- Benutzer-Dropdown-Menü -->
        <div class="user-menu" th:if="${currentUserDisplayName}">
          <button class="user-menu-button" id="userMenuButton">
            <i class="bi bi-person-circle"></i>
            <span th:text="${currentUserDisplayName}">Benutzer</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <a href="/admin" sec:authorize="hasRole('ADMIN')">
              <i class="bi bi-gear"></i> Administration
            </a>
            <div class="dropdown-divider"></div>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit" class="logout-button">
                <i class="bi bi-box-arrow-right"></i> Abmelden
              </button>
            </form>
          </div>
        </div>
      </nav>
    </div>
    <script th:src="@{/js/user-menu.js}"></script>
  </header>
</body>
</html>
