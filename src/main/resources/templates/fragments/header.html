<!-- src/main/resources/templates/fragments/header.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<body>
  <!-- Header Fragment -->
  <header class="header" th:fragment="header(activePage)">
    <div class="header-content">
      <h1>Sommerhausen Office Suite</h1>
      <nav class="nav">
        <a href="/contacts"
           th:classappend="${activePage == 'contacts'} ? 'active' : ''"
           sec:authorize="hasRole('CONTACT')">Kontakte</a>
        <a href="/hashtags"
           th:classappend="${activePage == 'hastags'} ? 'active' : ''"
           sec:authorize="hasRole('CONTACT')">Hashtags</a>
        <a href="/admin/users"
           th:classappend="${activePage == 'admin'} ? 'active' : ''"
           sec:authorize="hasRole('ADMIN')">Benutzerverwaltung</a>
        <form th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit">Abmelden</button>
        </form>
      </nav>
    </div>
  </header>
</body>
</html>
