<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feiertage - Sommerhausen Office Suite</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/calendar-event.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .search-section {
            margin: 1.5rem 0;
        }

        .search-form {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .search-form .search-wrapper {
            flex: 1;
            margin: 0;
            position: relative;
            display: flex;
            align-items: center;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            background-color: #fff;
            padding: 10px 14px;
            transition: all 0.3s ease;
        }

        .search-form .search-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            color: #999;
            font-size: 18px;
            margin-right: 10px;
            pointer-events: none;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 0;
            color: #333;
        }

        .search-input::placeholder {
            color: #bbb;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-success {
            background-color: #d4edda;
            color: #155724;
        }

        .badge-secondary {
            background-color: #e2e3e5;
            color: #383d41;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/app-layout :: app-layout('holidays', ~{::content})}">
        <th:block th:fragment="content">
            <h1>Feiertagsverwaltung</h1>

            <!-- Success/Error/Warning Messages -->
            <div th:if="${successMessage}" class="alert alert-success">
                <p th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" class="alert alert-error">
                <p th:text="${errorMessage}"></p>
            </div>
            <div th:if="${warningMessage}" class="alert alert-warning">
                <p th:text="${warningMessage}"></p>
            </div>

            <!-- Search Form -->
            <div class="search-section">
                <form method="get" th:action="@{/holidays}" class="search-form">
                    <div class="search-wrapper">
                        <i class="bi bi-search search-icon"></i>
                        <input type="search"
                               name="search"
                               th:value="${search}"
                               placeholder="Suche nach Name oder Beschreibung..."
                               class="search-input"
                               autocomplete="off">
                    </div>
                </form>
            </div>

            <!-- Action Buttons -->
            <div class="action-section" style="display: flex; gap: 10px;">
                <a th:href="@{/holidays/new}" class="btn btn-primary" title="Neuer Feiertag">
                    <i class="bi bi-plus-lg"></i>
                    Neuer Feiertag
                </a>
                <form method="post" th:action="@{/holidays/import}" style="margin: 0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary" title="Feiertage importieren"
                            onclick="return confirm('Möchten Sie die Feiertage für das aktuelle und nächste Jahr importieren? Bereits vorhandene Feiertage werden übersprungen.');">
                        <i class="bi bi-cloud-download"></i>
                        Feiertage importieren
                    </button>
                </form>
            </div>

            <!-- Results Info -->
            <p th:if="${search}" class="results-info">
                <span th:text="${holidays.size()}">0</span> Feiertag(e) gefunden für:
                <strong th:text="${search}"></strong>
            </p>
            <p th:if="${year}" class="results-info">
                <span th:text="${holidays.size()}">0</span> Feiertag(e) im Jahr
                <strong th:text="${year}"></strong>
            </p>

            <!-- Holiday Table -->
            <div th:if="${holidays.empty}" class="empty-state">
                <p>Keine Feiertage gefunden.</p>
            </div>

            <table th:unless="${holidays.empty}" class="contact-table">
                <thead>
                    <tr>
                        <th>Datum</th>
                        <th>Name</th>
                        <th>Beschreibung</th>
                        <th>Status</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="holiday : ${holidays}">
                        <td>
                            <strong th:text="${#temporals.format(holiday.date, 'dd.MM.yyyy')}"></strong>
                        </td>
                        <td>
                            <span th:text="${holiday.name}"></span>
                        </td>
                        <td>
                            <span th:if="${holiday.beschreibung}" th:text="${holiday.beschreibung}"></span>
                            <span th:unless="${holiday.beschreibung}">-</span>
                        </td>
                        <td>
                            <span th:if="${holiday.frei}" class="badge badge-success">Frei</span>
                            <span th:unless="${holiday.frei}" class="badge badge-secondary">Arbeitstag</span>
                        </td>
                        <td class="actions">
                            <a th:href="@{/holidays/{date}/edit(date=${holiday.date})}"
                               class="btn btn-small btn-secondary"
                               title="Bearbeiten">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <form method="post"
                                  th:action="@{/holidays/{date}/delete(date=${holiday.date})}"
                                  class="delete-holiday-form"
                                  style="display: inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-small btn-danger" title="Löschen">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <script th:src="@{/js/app.js}"></script>
        </th:block>
    </th:block>
</body>
</html>
