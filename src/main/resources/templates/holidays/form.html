<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Feiertag bearbeiten' : 'Neuer Feiertag'} + ' - Sommerhausen Office Suite'">
        Sommerhausen Office Suite
    </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <th:block th:replace="~{fragments/app-layout :: app-layout('holidays', ~{::content})}">
        <th:block th:fragment="content">
            <h1 th:text="${isEdit ? 'Feiertag bearbeiten' : 'Neuer Feiertag'}">Feiertag</h1>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert alert-error">
                <p th:text="${errorMessage}"></p>
            </div>

            <!-- Form -->
            <form method="post"
                  th:action="${isEdit ? '/holidays/' + originalDate : '/holidays'}"
                  th:object="${holiday}"
                  class="contact-form">

                <!-- CSRF Token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Datum -->
                <div class="form-group">
                    <label for="date">Datum <span class="required">*</span></label>
                    <input type="date"
                           id="date"
                           name="date"
                           th:value="${holiday.date != null ? holiday.date.toString() : ''}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('date')} ? 'error-input' : ''"
                           required>
                    <span th:if="${#fields.hasErrors('date')}"
                          th:errors="*{date}"
                          class="error"></span>
                    <small class="form-hint" th:if="${!isEdit}">
                        <i class="bi bi-info-circle"></i>
                        An jedem Datum kann nur ein Feiertag eingetragen werden
                    </small>
                    <small class="form-hint" th:if="${isEdit}">
                        <i class="bi bi-exclamation-triangle"></i>
                        Wenn Sie das Datum ändern, wird ein neuer Feiertag erstellt und der alte gelöscht
                    </small>
                </div>

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Name <span class="required">*</span></label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'error-input' : ''"
                           maxlength="50"
                           placeholder="z.B. Neujahr, Weihnachten, Ostermontag"
                           required>
                    <span th:if="${#fields.hasErrors('name')}"
                          th:errors="*{name}"
                          class="error"></span>
                </div>

                <!-- Beschreibung -->
                <div class="form-group">
                    <label for="beschreibung">Beschreibung</label>
                    <textarea id="beschreibung"
                              th:field="*{beschreibung}"
                              class="form-control"
                              th:classappend="${#fields.hasErrors('beschreibung')} ? 'error-input' : ''"
                              maxlength="500"
                              rows="3"
                              placeholder="Optionale Beschreibung des Feiertags"></textarea>
                    <span th:if="${#fields.hasErrors('beschreibung')}"
                          th:errors="*{beschreibung}"
                          class="error"></span>
                </div>

                <!-- Frei (Boolean) -->
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="hidden" name="_frei" value="on">
                        <input type="checkbox"
                               id="frei"
                               th:field="*{frei}"
                               class="form-checkbox">
                        <label for="frei">
                            Arbeitsfrei
                            <small class="form-hint" style="display: block; margin-top: 0.25rem;">
                                <i class="bi bi-info-circle"></i>
                                Markieren, wenn an diesem Tag nicht gearbeitet wird
                            </small>
                        </label>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:title="${isEdit ? 'Aktualisieren' : 'Erstellen'}">
                        <i class="bi bi-check-lg"></i>
                        <span th:text="${isEdit ? 'Aktualisieren' : 'Erstellen'}">Speichern</span>
                    </button>
                    <a th:href="@{/holidays}" class="btn btn-secondary" title="Abbrechen">
                        <i class="bi bi-x-lg"></i>
                        Abbrechen
                    </a>
                </div>
            </form>

            <script th:src="@{/js/app.js}"></script>
        </th:block>
    </th:block>
</body>
</html>
